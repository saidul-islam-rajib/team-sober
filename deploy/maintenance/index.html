<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Back in a moment — Team Sober</title>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --border: #dfe6ee;
    --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b;
    --accent: #0f766e; --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #161920; --border: #2a2f3a;
      --ink: #f2f4f7; --ink-2: #c3c8d2; --ink-3: #8a92a3;
      --accent: #2dd4bf; --accent-ink: #06251f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    padding: 1.5rem; background: var(--bg); color: var(--ink-2);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%; max-width: 460px; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem 1.75rem;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
  }
  .logo { display: block; margin: 0 auto 1.25rem; }
  h1 { color: var(--ink); font-size: 1.45rem; line-height: 1.25; margin-bottom: 0.6rem; }
  p { font-size: 0.98rem; }
  .status {
    display: inline-flex; align-items: center; gap: 0.55rem;
    margin-top: 1.5rem; font-size: 0.86rem; color: var(--ink-3);
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  button {
    margin-top: 1.25rem; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-family: inherit; font-weight: 600; font-size: 0.92rem; padding: 0.6rem 1.3rem;
  }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Team Sober" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="15" fill="#0f172a" />
    <path d="M48.5 33.5 A17 17 0 1 1 30.5 15.05" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M36.4 27.6 L36.4 16.4 A11.2 11.2 0 0 1 47.6 27.6 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="3.2" stroke-linejoin="round" />
  </svg>
  <h1>We're shipping an update</h1>
  <p>Team Sober is being updated right now. It usually takes less than a minute, and nothing you were reading is lost.</p>
  <div class="status" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text">This page will reload by itself when we're back.</span>
  </div>
  <div><button type="button" id="retry">Try again now</button></div>
</main>
<script>
(function () {
  var text = document.getElementById('status-text');
  var tries = 0;

  function check() {
    tries++;
    fetch(location.href, { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) {
        if (res.status !== 502 && res.status !== 503 && res.status !== 504) {
          location.reload();
          return;
        }
        if (tries >= 12) {
          text.textContent = 'Taking a little longer than usual. Still checking…';
        }
        schedule();
      })
      .catch(schedule);
  }

  function schedule() {
    window.setTimeout(check, tries < 12 ? 5000 : 15000);
  }

  document.getElementById('retry').addEventListener('click', function () {
    location.reload();
  });

  schedule();
})();
</script>
</body>
</html>
